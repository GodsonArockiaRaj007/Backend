// Task 15
// Build a mini Employee Management System using only ES6+ features such as:
// Arrow Functions
// Template Literals
// Destructuring
// Spread Operator
// Rest Parameters
// Default Parameters
// Optional Chaining
// Nullish Coalescing
// Enhanced Object Literals
// and implement:
// Add Employee
// Update Employee
// Display Employee
// Calculate Salary




// Employee Management System

let employees = [];


const addEmployee = (id,name,department="Trainee",monthlySalary=15000)=>   // Default Parameters   // Arrow Functions
{
    const employee = {
        id,
        name,
        department,
        monthlySalary
    };  // Enhanced Object Literals

    employees = [...employees, employee]; // Spread Operator
    console.log(`${name} added successfully.`);  // Template Literals
};

const updateEmployee = (id, updates) => {

    employees = employees.map((emp)=>emp.id==id ? {...emp,...updates}: emp); //Ternary Operator

    console.log(`Employee ${id} updated successfully.`);
};


const displayEmployee = (id) =>
{
    const employee=employees.find((emp)=>emp.id==id);
    if (!employee) {
        console.log("Employee not found");
        return;
    }

    const {name,department,monthlySalary}=employee; // Destructuring

    console.log(`
Employee Details
id: ${employee?.id ?? "Data not available"}  
name: ${name}
department: ${department ?? "Data not available"}
Salary: ₹${monthlySalary}
`);
};  // Optional Chaining  // Nullish Coalescing


const calculateSalary = (monthlySalary) =>   
{
    return monthlySalary * 12;
       
};

const calculateTotalSalary =(...salaries)=>{   // Rest Parameters
    let total = 0;
    for (let salary of salaries) {
        total += salary;
    }
    return total;
};



addEmployee(101, "Godson", "Backend", 50000);
addEmployee(102, "Darwin", "Frontend", 40000);
addEmployee(103, "Joel"); // Default Parameters



displayEmployee(101);
displayEmployee(102);
displayEmployee(103);


updateEmployee(103, {department: "Full Stack",monthlySalary: 45000});

displayEmployee(103);


console.log(`Annual Salary: ₹${calculateSalary(50000)}`);

console.log("Total Monthly Salary:",calculateTotalSalary(50000,40000,45000));
